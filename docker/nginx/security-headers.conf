# Security-Header für alle Antworten des Web-Containers (WP-022). Wird in **jedem** location-Block per include
# eingebunden: nginx vererbt add_header nicht in locations, die selbst add_header setzen (Cache-Control).
# `always`: auch bei Fehlerantworten (4xx/5xx). HSTS setzt Cloudflare (docs/OPERATIONS.md, „Security-Checkliste“).
# Ein Test prüft Inhalt und Einbindung: scripts/test/nginx-headers.test.mjs.
#
# CSP: nur eigene Dateien. Keine Inline-Skripte (Vite baut index.html ohne; registerSW.js ist eine eigene Datei),
# kein eval. style-src ohne 'unsafe-inline': React setzt style-Props per CSSOM, das erlaubt die CSP.
# connect-src: API und WebSocket auf derselben Origin (D-014); wss://$host zusätzlich, weil ältere Safari-Versionen
# wss: nicht über 'self' erlauben. frame-ancestors 'none' entspricht X-Frame-Options DENY (für alte Browser).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://$host; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
