# Dev-Umgebung (D-002, D-005, D-006). Start: npm run dev:up (Projektname poker-dev).
# Alle Host-Ports nur an 127.0.0.1 und aus 4310–4319; überschreibbar per .env (siehe .env.example).
name: poker-dev

x-node: &node
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: poker-dev-node
  working_dir: /app
  volumes:
    - .:/app
    # Anonymes Volume: Linux-node_modules aus dem Image, nicht die des Hosts.
    - /app/node_modules
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poker}
      POSTGRES_DB: ${POSTGRES_DB:-poker}
    ports:
      - '127.0.0.1:${DB_PORT:-4312}:5432'
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    <<: *node
    command: ['npm', 'run', 'dev', '-w', '@poker/server']
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4311
      DATABASE_URL: postgres://${POSTGRES_USER:-poker}:${POSTGRES_PASSWORD:-poker}@db:5432/${POSTGRES_DB:-poker}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4310}
      # tsx watch bemerkt Änderungen über den macOS-Bind-Mount nur per Polling (im Smoke-Test geprüft).
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '127.0.0.1:${SERVER_PORT:-4311}:4311'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4311/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    <<: *node
    command: ['npm', 'run', 'dev', '-w', '@poker/web']
    environment:
      NODE_ENV: development
      WEB_DEV_HOST: 0.0.0.0
      WEB_DEV_PORT: 4310
      API_PROXY_TARGET: http://server:4311
      # Vite bekommt die Dateievents über den Bind-Mount; Polling nur bei Bedarf.
      VITE_USE_POLLING: ${WEB_WATCH_POLLING:-false}
    ports:
      - '127.0.0.1:${WEB_PORT:-4310}:4310'
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:4310/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  db:
    name: poker-dev-db
