    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-2: #1f2630;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #f5c542;
        --felt: #1e6b45;
        --line: rgb(255 255 255 / 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          -apple-system,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgb(13 17 23 / 0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      p.lead {
        margin: 0 0 10px;
        color: var(--muted);
        max-width: 70ch;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button,
      .chip {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--text);
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .chip[aria-pressed='true'] {
        background: var(--accent);
        color: #1a1300;
        border-color: var(--accent);
      }
      .spacer {
        flex: 1;
      }
      #count {
        color: var(--muted);
      }
      main {
        padding: 16px;
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .card.fav {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .stage {
        aspect-ratio: 1;
        background: var(--surface-2);
        position: relative;
        cursor: pointer;
      }
      body.felt .stage {
        background: radial-gradient(circle, #2a8a5b, var(--felt) 70%);
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .stage .hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 13px;
      }
      .meta {
        padding: 8px 10px 10px;
        display: grid;
        gap: 4px;
      }
      .name {
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .row a {
        color: var(--muted);
      }
      label.favbox {
        margin-left: auto;
        display: flex;
        gap: 4px;
        align-items: center;
        color: var(--text);
        cursor: pointer;
      }
      .num {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      dialog {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 12px;
        max-width: min(560px, 92vw);
      }
      textarea {
        width: 100%;
        min-height: 160px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        font:
          13px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Animationen nach der Hand – aussuchen</h1>
      <p class="lead">
        Tippen auf eine Animation spielt sie von vorn. Mit ★ merken, dann „Favoriten kopieren“ und an Claude schicken.
        Gemerkte Favoriten bleiben nur in deinem Browser. Quelle: LottieFiles (kostenlose Animationen).
      </p>
      <div class="bar" id="filters"></div>
      <div class="bar" style="margin-top: 8px">
        <button id="felt" aria-pressed="false" class="chip">Auf Tisch-Grün ansehen</button>
        <button id="onlyfav" aria-pressed="false" class="chip">Nur Favoriten</button>
        <span class="spacer"></span>
        <span id="count"></span>
        <button id="copy">Favoriten kopieren</button>
      </div>
    </header>
    <main id="grid"></main>
    <dialog id="out">
      <p>Diese Liste an Claude schicken:</p>
      <textarea id="outtext" readonly></textarea>
      <p><button id="close">Schließen</button></p>
    </dialog>

      ];
      const KEY = 'poker-anim-favs';
      let favs;
      try {
        favs = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
      } catch {
        favs = new Set();
      }
      const save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify([...favs]));
        } catch {}
      };

      const grid = document.getElementById('grid');
      const cats = ['Alle', ...new Set(ITEMS.map((i) => i.cat))];
      let cat = 'Alle',
        onlyFav = false;
      const players = new Map();

      const filters = document.getElementById('filters');
      for (const c of cats) {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = c;
        b.setAttribute('aria-pressed', String(c === cat));
        b.onclick = () => {
          cat = c;
          for (const x of filters.children) x.setAttribute('aria-pressed', String(x === b));
          render();
        };
        filters.append(b);
      }

      const io = new IntersectionObserver(
        (entries) => {
          for (const e of entries) {
            const id = e.target.dataset.id;
            let p = players.get(id);
            if (e.isIntersecting) {
              if (!p) {
                const item = ITEMS.find((i) => i.id === id);
                const canvas = e.target.querySelector('canvas');
                p = new DotLottie({ canvas, src: item.src, autoplay: true, loop: true });
                p.addEventListener('load', () => e.target.querySelector('.hint')?.remove());
                p.addEventListener('loadError', () => {
                  const h = e.target.querySelector('.hint');
                  if (h) h.textContent = 'Konnte nicht geladen werden';
                });
                players.set(id, p);
              } else p.play();
            } else if (p) p.pause();
          }
        },
        { rootMargin: '200px' },
      );

      ITEMS.forEach((item, n) => {
        const el = document.createElement('article');
        el.className = 'card';
        el.dataset.id = item.id;
        el.innerHTML = `<div class="stage" data-id="${item.id}"><span class="hint">lädt …</span><canvas></canvas></div>
      <div class="meta"><div class="name"><span class="num">#${n + 1}</span> ${item.name}</div>
      <div class="row"><span>${item.cat}</span><a href="${item.page}" target="_blank" rel="noopener">LottieFiles ↗</a>
      <label class="favbox"><input type="checkbox"> ★</label></div></div>`;
        const stage = el.querySelector('.stage');
        stage.onclick = () => {
          const p = players.get(item.id);
          if (p) {
            p.stop();
            p.play();
          }
        };
        const box = el.querySelector('input');
        box.checked = favs.has(item.id);
        box.onchange = () => {
          box.checked ? favs.add(item.id) : favs.delete(item.id);
          save();
          render();
        };
        item.el = el;
        item.num = n + 1;
        grid.append(el);
        io.observe(stage);
      });

      function render() {
        let shown = 0;
        for (const i of ITEMS) {
          const vis = (cat === 'Alle' || i.cat === cat) && (!onlyFav || favs.has(i.id));
          i.el.hidden = !vis;
          i.el.classList.toggle('fav', favs.has(i.id));
          if (vis) shown++;
        }
        document.getElementById('count').textContent = `${shown} angezeigt · ${favs.size} Favoriten`;
      }
      render();

      const toggle = (id, fn) => {
        const b = document.getElementById(id);
        b.onclick = () => {
          const v = b.getAttribute('aria-pressed') !== 'true';
          b.setAttribute('aria-pressed', String(v));
          fn(v);
        };
      };
      toggle('felt', (v) => document.body.classList.toggle('felt', v));
      toggle('onlyfav', (v) => {
        onlyFav = v;
        render();
      });

      const dlg = document.getElementById('out');
      document.getElementById('copy').onclick = async () => {
        const text =
          ITEMS.filter((i) => favs.has(i.id))
            .map((i) => `#${i.num} ${i.name} – ${i.page}`)
            .join('\n') || '(noch keine Favoriten)';
        document.getElementById('outtext').value = text;
        try {
          await navigator.clipboard.writeText(text);
        } catch {}
        dlg.showModal();
      };
      document.getElementById('close').onclick = () => dlg.close();
    </script>
