<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Poker</title>
    <meta name="description" content="Texas Hold’em mit Freunden – nur Spielgeld" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Homescreen-Start im Vollbild (iOS/Android); Statusleiste transparent über dem dunklen Hintergrund. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poker" />
    <!--
      Link-Vorschau in Messengern (WP-030, Open Graph/Twitter). Crawler führen kein JS aus, daher stehen die Tags hier.
      Allgemeiner Text, keine Tischdaten (gilt auch für /join/… privater Tische). Bild und URL müssen absolut sein und
      zur aufgerufenen Domain passen (D-023): __POKER_ORIGIN__ ersetzt nginx per sub_filter
      (docker/nginx/default.conf.template); der Vite-Dev-Server lässt den Platzhalter weg (relative URLs, nur lokal).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Poker" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Poker – Spiel mit Freunden" />
    <meta property="og:description" content="Texas Hold’em mit Freunden – nur Spielgeld. Komm an den Tisch!" />
    <meta property="og:url" content="__POKER_ORIGIN__/" />
    <meta property="og:image" content="__POKER_ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pokertisch mit Karten und Chips – Poker, Spiel mit Freunden" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Poker – Spiel mit Freunden" />
    <meta name="twitter:description" content="Texas Hold’em mit Freunden – nur Spielgeld. Komm an den Tisch!" />
    <meta name="twitter:image" content="__POKER_ORIGIN__/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
